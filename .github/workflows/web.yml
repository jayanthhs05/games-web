name: Deploy Alagulimane (web)

on:
  push:
    branches: [alagulimane]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build WebAssembly distribution
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon wasmJsBrowserDistribution
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/dist/wasmJs/productionExecutable

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
