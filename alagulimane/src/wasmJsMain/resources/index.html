<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <title>Alagulimane</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #1A1A1A;
        }
        #loading {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #FFD700;
            font-family: system-ui, sans-serif;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div id="loading">Loading Alagulimane…</div>
    <script type="application/javascript">
        // Remove the loading text once Compose has drawn its first frame.
        window.addEventListener('load', () => {
            const el = document.getElementById('loading');
            if (el) setTimeout(() => el.remove(), 1500);
        });
    </script>
    <script src="alagulimane.js"></script>
</body>
</html>
