server {
    listen       80;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html;

    # Kotlin/Wasm + Skia ship large .wasm/.js assets — compress and cache them.
    gzip            on;
    gzip_types      application/javascript application/wasm text/css image/svg+xml;
    gzip_min_length 1024;

    types {
        application/wasm wasm;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(wasm|js|css)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }
}
